[tool.poetry]
name = "artemis-final-demo"
version = "0.1.0"
description = "ARTEMIS: Real-time Sign and Emotion Classification"
authors = ["Rhishi Kumar <rhishikumar@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
opencv-python = "4.9.0.80"
numpy = "1.26.4"
ultralytics = "8.2.2"
mediapipe = "0.10.14"
onnxruntime = "1.18.0"
transformers = "4.41.2"
torch = "2.3.1"
Pillow = "10.3.0"
pandas = "^2.3.1"
scikit-learn = "^1.7.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
